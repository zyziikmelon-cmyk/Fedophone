<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="referrer" content="no-referrer"><title>Fedophone — проверка связи</title>
<style>body{margin:0;background:#1e1f22;color:#f2f3f5;font:15px/1.5 system-ui,Segoe UI,sans-serif}main{max-width:640px;margin:0 auto;padding:22px 16px 60px}h1{font-size:1.4em;margin:0 0 4px}p{color:#b5bac1;margin:0 0 16px}
.r{display:flex;gap:10px;align-items:flex-start;background:#2b2d31;border-radius:12px;padding:10px 12px;margin-bottom:8px}.r b{display:block}.r small{color:#b5bac1}.i{width:22px;flex:none;text-align:center}
button{border:0;border-radius:10px;padding:11px 16px;font:inherit;font-weight:700;cursor:pointer;background:#5865f2;color:#fff;margin:6px 6px 0 0}button.g{background:#3a3c42}#sum{margin:14px 0;padding:12px;border-radius:12px;background:#2b2d31;white-space:pre-wrap;font:13px/1.45 ui-monospace,Consolas,monospace}</style></head>
<body><main><h1>Проверка связи Fedophone</h1><p>Выключи VPN и нажми «Начать». Займёт около 30 секунд. Потом нажми «Скопировать» и отправь результат.</p>
<button id="go">Начать</button><button class="g" id="cp" hidden>Скопировать результат</button><div id="out"></div><div id="sum" hidden></div></main>
<script>
const out=document.getElementById('out'),R=[];
function row(name){const d=document.createElement('div');d.className='r';d.innerHTML='<span class="i">⏳</span><div><b></b><small>проверяю…</small></div>';d.querySelector('b').textContent=name;out.append(d);
  return(ok,txt)=>{d.querySelector('.i').textContent=ok===1?'✅':ok===0?'❌':'⚠️';d.querySelector('small').textContent=txt;R.push((ok===1?'OK ':ok===0?'NO ':'~~ ')+name+': '+txt)}}
const T=(p,ms)=>Promise.race([p,new Promise((_,j)=>setTimeout(()=>j(new Error('timeout')),ms))]);
async function site(name,url){const done=row(name);const t=Date.now();
  try{const same=new URL(url).origin===location.origin;
    if(same){const r=await T(fetch(url+'?t='+t,{cache:'no-store'}),20000);const rd=r.body.getReader();let n=0;
      const ok=await T((async()=>{for(;;){const x=await rd.read();if(x.done)return true;n+=x.value.length}})(),20000).catch(()=>false);
      ok?done(1,'загрузилась '+Math.round(n/1024)+' КБ за '+((Date.now()-t)/1000).toFixed(1)+' с'):done(0,'загрузка встала на '+Math.round(n/1024)+' КБ — соединение душат')}
    else{await T(fetch(url+'?t='+t,{mode:'no-cors',cache:'no-store'}).then(r=>r.blob()),20000);done(1,'открывается ('+((Date.now()-t)/1000).toFixed(1)+' с)')}}
  catch(e){done(0,e.message==='timeout'?'не загружается за 20 с':'не открывается')}}
async function api(name,url){const done=row(name);const t=Date.now();try{await T(fetch(url,{mode:'no-cors',cache:'no-store'}),12000);done(1,'отвечает ('+(Date.now()-t)+' мс)')}catch(e){done(0,'не отвечает')}}
function mq(len){const a=[];do{let d=len%128;len=Math.floor(len/128);if(len)d|=128;a.push(d)}while(len);return a}
function ms(s){const b=new TextEncoder().encode(s);return[b.length>>8,b.length&255,...b]}
function pkt(h,body){return new Uint8Array([h,...mq(body.length),...body])}
function broker(name,url){return new Promise(res=>{const done=row(name);let rx=0,ok=false,ws,last=0;const topic='fpnet/'+Math.random().toString(36).slice(2);
  const fin=(s,t)=>{try{ws.close()}catch(e){}done(s,t);res()};
  const to=setTimeout(()=>fin(ok?(rx>=28000?1:2):0,ok?(rx>=28000?'прошло 30 КБ, не душат':'встаёт после ~'+Math.round(rx/1024)+' КБ — душат, Fedophone это обходит'):'не подключается'),16000);
  try{ws=new WebSocket(url,['mqtt'])}catch(e){clearTimeout(to);fin(0,'не подключается');return}
  ws.binaryType='arraybuffer';
  ws.onopen=()=>ws.send(pkt(0x10,[...ms('MQTT'),4,2,0,40,...ms('fpnet'+Math.random().toString(36).slice(2,10))]));
  ws.onmessage=e=>{const u=new Uint8Array(e.data);rx+=u.length;
    if(!ok&&u[0]===0x20){ok=true;ws.send(pkt(0x82,[0,1,...ms(topic),0]));
      const pay=new Uint8Array(1200).fill(65);let i=0;const iv=setInterval(()=>{if(i++>=25||ws.readyState!==1){clearInterval(iv);return}ws.send(pkt(0x30,[...ms(topic),...pay]))},250)}
    if(rx>=31000){clearTimeout(to);fin(1,'прошло 30 КБ, не душат')}};
  ws.onerror=ws.onclose=()=>{if(!ok){clearTimeout(to);fin(0,'не подключается')}}})}
function stun(){return new Promise(res=>{const done=row('Определение адреса (STUN)');let pc;try{pc=new RTCPeerConnection({iceServers:[{urls:'stun:stun.l.google.com:19302'},{urls:'stun:stun.sipnet.ru:3478'}]})}catch(e){done(0,'браузер не умеет звонки');return res()}
  let srflx=false;pc.createDataChannel('x');pc.onicecandidate=e=>{if(e.candidate&&/ srflx /.test(e.candidate.candidate))srflx=true};
  pc.createOffer().then(o=>pc.setLocalDescription(o));setTimeout(()=>{pc.close();done(srflx?1:0,srflx?'внешний адрес есть — прямые звонки возможны':'UDP закрыт — звонки только через ретранслятор');res()},6000)})}
document.getElementById('go').onclick=async()=>{const b=document.getElementById('go');b.disabled=true;out.innerHTML='';R.length=0;
  await site('Сайт: GitHub Pages','https://zyziikmelon-cmyk.github.io/Fedophone/index.html');
  await site('Сайт: Cloudflare','https://fedophone.pages.dev/index.html');
  await api('Сервер входа','https://fedophone-auth.fedophone.workers.dev/me');
  await api('Ретранслятор (выдача пароля)','https://fedophone-turn.fedophone.workers.dev/');
  await Promise.all([broker('Связь: EMQX','wss://broker.emqx.io:8084/mqtt'),broker('Связь: HiveMQ','wss://broker.hivemq.com:8884/mqtt'),broker('Связь: Mosquitto','wss://test.mosquitto.org:8081/mqtt'),broker('Связь: EMQX-2','wss://broker-cn.emqx.io:8084/mqtt')]);
  await api('Связь: ntfy','https://ntfy.sh/v1/health');
  await stun();
  const s=document.getElementById('sum');s.hidden=false;s.textContent='Fedophone net test '+new Date().toISOString().slice(0,16)+'\n'+navigator.userAgent.slice(0,90)+'\n'+R.join('\n');
  document.getElementById('cp').hidden=false;b.disabled=false;b.textContent='Ещё раз'};
document.getElementById('cp').onclick=()=>{const t=document.getElementById('sum').textContent;(navigator.clipboard?navigator.clipboard.writeText(t):Promise.reject()).then(()=>alert('Скопировано — отправь в Telegram'),()=>prompt('Скопируй:',t))};
</script></body></html>
